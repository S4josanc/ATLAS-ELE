<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ATLAS ELE · Fichas Premium con datos reales</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f8;color:#153953;font-family:Inter,system-ui,Segoe UI,sans-serif}header{background:#073354;color:white;padding:17px clamp(16px,4vw,52px);display:flex;align-items:center;justify-content:space-between}header b{font-size:23px}header b span{color:#8de3ff}a{color:inherit}header a{font-size:13px;color:#d8f2ff;text-decoration:none}main{max-width:1240px;margin:auto;padding:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}.toolbar h1{font-size:22px;margin:0}.toolbar select{border:1px solid #c9dce8;border-radius:12px;background:white;padding:12px;min-width:260px;max-width:100%;font-size:14px}.profile{background:#fff;border:1px solid #dce8f0;border-radius:22px;overflow:hidden;box-shadow:0 14px 38px #173d5820}.hero{background:radial-gradient(circle at 80% 10%,#3fa5ce77,transparent 42%),linear-gradient(110deg,#062b4b,#0c5c87);color:white;padding:28px;display:flex;align-items:center;gap:20px;min-height:185px}.mark{display:grid;place-items:center;background:#e5f6ff;color:#0c5177;border-radius:17px;width:82px;height:82px;flex-shrink:0;font-size:28px;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.14em;color:#a5e7ff;font-weight:800}.hero h2{font-size:clamp(24px,3vw,37px);margin:8px 0;line-height:1.15}.hero p{margin:0;color:#d8edfa}.content{display:grid;grid-template-columns:1fr 1.2fr .95fr;gap:14px;padding:16px;background:#f6fafd}.card{background:#fff;border:1px solid #e0eaf1;border-radius:15px;padding:18px;min-width:0}.card h3{font-size:15px;margin:0 0 14px;color:#123d5c}.fact{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef3f6;padding:10px 0;font-size:12px}.fact span{color:#6d8798}.fact strong{text-align:right;overflow-wrap:anywhere}.fact:last-child{border:0}.card p{font-size:13px;line-height:1.65;color:#526e80}.note{padding:12px;background:#eaf6fc;border-left:4px solid #329bc7;border-radius:10px;font-size:12px;line-height:1.6}.action{display:block;background:#0c78b2;color:#fff;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:800;font-size:13px;margin-top:12px}.action[hidden]{display:none}.caption{font-size:12px;color:#667f90;margin:15px 2px}.loading{padding:35px;text-align:center}@media(max-width:900px){.content{grid-template-columns:1fr 1fr}.card:last-child{grid-column:1/-1}}@media(max-width:600px){.content{grid-template-columns:1fr}.card:last-child{grid-column:auto}.hero{padding:20px;gap:12px}.mark{width:55px;height:55px;font-size:20px}.toolbar select{width:100%}}
</style></head><body><header><b>ATLAS <span>ELE</span></b><a href="./">← Volver al mapa</a></header><main><div class="toolbar"><h1>Fichas Premium · Centros reales</h1><select id="pick" aria-label="Seleccionar institución"><option>Cargando instituciones…</option></select></div><div id="view" class="loading">Cargando datos públicos de ATLAS ELE…</div><p class="caption">Vista previa no indexada · Datos del archivo piloto público. Los marcadores aproximados no representan necesariamente el edificio. Esta página no modifica el mapa principal.</p></main><script>
const pick=document.getElementById('pick'),view=document.getElementById('view');let rows=[];
function element(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function fact(parent,label,value){const row=element('div','fact');row.append(element('span','',label),element('strong','',value||'No disponible'));parent.append(row)}
function render(x){view.replaceChildren();view.className='profile';const hero=element('div','hero'),mark=element('div','mark',String(x.name||'?').trim().split(/\s+/).slice(0,2).map(z=>z[0]).join('').toUpperCase()),heading=element('div');heading.append(element('div','eyebrow','ATLAS ELE · PERFIL INSTITUCIONAL'),element('h2','',x.name),element('p','',[x.city,x.country].filter(Boolean).join(' · ')));hero.append(mark,heading);
const content=element('div','content'),one=element('section','card'),two=element('section','card'),three=element('section','card');one.append(element('h3','','Información clave'));fact(one,'Categoría',({school:'Centro escolar',university:'Universidad',language:'Academia',association:'Asociación',cervantes:'Instituto Cervantes',teacher:'Profesor'})[x.type]||x.type);fact(one,'Ciudad',x.city);fact(one,'País',x.country);fact(one,'Dirección',x.address);two.append(element('h3','','Enseñanza y confianza'));fact(two,'Programa registrado',x.program);fact(two,'Precisión declarada',({city:'Ciudad aproximada',region:'Región aproximada',country:'País aproximado',address:'Dirección registrada',exact:'Coordenadas declaradas exactas'})[x.precision]||'Sin clasificar');two.append(element('div','note','La información procede de los registros públicos de ATLAS ELE. No implica verificación independiente ni acreditación oficial.'));three.append(element('h3','','Ubicación y contacto'));three.append(element('p','',x.address||'No hay dirección postal registrada. El marcador puede representar solo el centro de la ciudad.'));if(x.address){const a=element('a','action','↗ Consultar dirección en Google Maps');a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([x.address,x.city,x.country].filter(Boolean).join(', '));a.target='_blank';a.rel='noopener noreferrer';three.append(a)}if(typeof x.web==='string'&&/^https:\/\//i.test(x.web)){const a=element('a','action','↗ Web registrada');a.href=x.web;a.target='_blank';a.rel='noopener noreferrer';three.append(a)}content.append(one,two,three);view.append(hero,content)}
fetch('data/pilot-city-points.json?v=premium-real-1').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{rows=(j.institutions||[]).filter(x=>x.id&&x.name).sort((a,b)=>a.name.localeCompare(b.name));pick.replaceChildren();for(const x of rows){const opt=element('option','',x.name+' · '+[x.city,x.country].filter(Boolean).join(', '));opt.value=x.id;pick.append(opt)}pick.onchange=()=>render(rows.find(x=>x.id===pick.value));const query=new URLSearchParams(location.search).get('institution');if(query&&rows.some(x=>x.id===query))pick.value=query;if(rows.length)render(rows.find(x=>x.id===pick.value));else view.textContent='No hay registros disponibles'}).catch(()=>{view.textContent='No se pudieron cargar los datos. Vuelve a intentarlo.'});
</script></body></html>
