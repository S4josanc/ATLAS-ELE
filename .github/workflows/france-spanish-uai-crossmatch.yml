name: ATLAS Spanish sections UAI crossmatch
on:
  workflow_dispatch:
jobs:
  crossmatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Crossmatch Spanish sections with official directory
        run: |
          mkdir -p audits
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,gzip,time
          base="https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/"
          def query(dataset,params):
              url=base+dataset+"/records?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"ATLAS-ELE-audit/1.0"})
              with urllib.request.urlopen(req,timeout=45) as response:raw=response.read()
              if raw.startswith(bytes([31,139])):raw=gzip.decompress(raw)
              return json.loads(raw.decode("utf-8"))
          data=query("fr-en-sections-internationales",{"where":"section = 'ESPAGNOLE'","limit":100})
          matches=[];pending=[]
          for row in data.get("results",[]):
              uai=str(row.get("uai") or row.get("UAI") or "").strip()
              if not uai:pending.append({"section":row,"reason":"missing UAI"});continue
              try:
                  result=query("fr-en-annuaire-education",{"where":"identifiant_de_l_etablissement = '"+uai.replace("'","")+" '","limit":1})
                  # Retry without trailing whitespace, which some portals normalize differently
                  if not result.get("results"):
                      result=query("fr-en-annuaire-education",{"where":"identifiant_de_l_etablissement = '"+uai+"'","limit":1})
                  found=result.get("results",[])
                  if not found:pending.append({"uai":uai,"reason":"no directory match"});continue
                  r=found[0]
                  item={"uai":uai,"name":r.get("nom_etablissement"),"city":r.get("nom_commune"),"address":r.get("adresse_1"),"postal_code":r.get("code_postal"),"latitude":r.get("latitude"),"longitude":r.get("longitude"),"website":r.get("web"),"location_precision":r.get("precision_localisation"),"source_section":row}
                  if not all([item["name"],item["city"],item["address"],item["postal_code"],item["latitude"],item["longitude"],item["website"]]):
                      pending.append({"uai":uai,"reason":"incomplete directory fields","record":item})
                  else:matches.append(item)
              except Exception as e:pending.append({"uai":uai,"reason":str(e)})
          output={"official_spanish_rows":data.get("total_count"),"matched_with_fields":len(matches),"pending":len(pending),"candidates":matches,"review":pending}
          with open("audits/france-spanish-uai-crossmatch.json","w",encoding="utf8") as f:json.dump(output,f,ensure_ascii=False,indent=2)
          print("Official Spanish-section rows:",data.get("total_count"))
          print("Matched with basic fields:",len(matches))
          print("Pending:",len(pending))
          print("No publication performed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-spanish-uai-crossmatch
          path: audits/france-spanish-uai-crossmatch.json
          if-no-files-found: warn
