name: Map icon cache safety check
on:
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - name: Verify cache guard and single icon factory
        run: |
          node -e "const s=require('fs').readFileSync('app.js','utf8');if(!s.includes('atlasMarkerIcons.has(key)')||!s.includes('atlasMarkerIcons.set(key,markerIcon)'))process.exit(1)"
