name: ATLAS ELE audit smoke tests
on:
  push:
    branches:
      - audit/geolocation-2026-10-13
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data/verification-evidence.js
      - name: Generate data quality report
        run: node tests/data-quality.cjs
      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ele-data-quality
          path: audit-output/pilot-quality.json
          if-no-files-found: warn
          retention-days: 14
      - name: Serve preview and run browser tests
        run: |
          python3 -m http.server 8765 > /tmp/atlas-http.log 2>&1 &
          node tests/browser-smoke.cjs
      - name: Upload mobile screenshot for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ele-mobile-preview
          path: /tmp/atlas-mobile.png
          if-no-files-found: warn
          retention-days: 14
