name: Filter optimization check
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - name: Confirm single query normalization
        run: |
          node -e "const s=require('fs').readFileSync('app.js','utf8');if(!s.includes('const cityQuery=advancedFilter.city?normSearch(advancedFilter.city)'))process.exit(1)"
